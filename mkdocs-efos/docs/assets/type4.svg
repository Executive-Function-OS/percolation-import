<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="300" height="200" rx="16" fill="#0f172a" />
  <g opacity="0.1">
    <line x1="0" y1="50" x2="300" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="0" y1="100" x2="300" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="0" y1="150" x2="300" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="75" y1="0" x2="75" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="150" y1="0" x2="150" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="225" y1="0" x2="225" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
  </g>
  <!-- Fragmented Edges -->
  <line x1="50" y1="100" x2="100" y2="70" stroke="#b91c1c" stroke-width="3" stroke-dasharray="3" filter="url(#glow)" />
  <line x1="100" y1="70" x2="80" y2="130" stroke="#b91c1c" stroke-width="3" stroke-dasharray="3" filter="url(#glow)" />
  <line x1="80" y1="130" x2="50" y2="100" stroke="#b91c1c" stroke-width="3" stroke-dasharray="3" filter="url(#glow)" />
  <line x1="200" y1="130" x2="250" y2="100" stroke="#b91c1c" stroke-width="3" stroke-dasharray="3" filter="url(#glow)" />
  <!-- Nodes -->
  <circle cx="50" cy="100" r="10" fill="url(#redGrad)" stroke="#f87171" stroke-width="2" filter="url(#glow)" />
  <circle cx="100" cy="70" r="10" fill="url(#redGrad)" stroke="#f87171" stroke-width="2" filter="url(#glow)" />
  <circle cx="80" cy="130" r="10" fill="url(#redGrad)" stroke="#f87171" stroke-width="2" filter="url(#glow)" />
  <circle cx="150" cy="100" r="10" fill="#7f1d1d" stroke="#b91c1c" stroke-width="2" />
  <circle cx="200" cy="130" r="10" fill="url(#redGrad)" stroke="#f87171" stroke-width="2" filter="url(#glow)" />
  <circle cx="250" cy="100" r="10" fill="url(#redGrad)" stroke="#f87171" stroke-width="2" filter="url(#glow)" />
  <!-- Text -->
  <text x="50" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">Start</text>
  <text x="250" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">Exit</text>
  <text x="150" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Type 4 — Paradox (Fragmented)</text>
</svg>
