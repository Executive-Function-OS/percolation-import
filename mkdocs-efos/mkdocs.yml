site_name: "Executive Function OS"
site_description: "Research platform: percolation-theoretic analysis of digital interaction graphs with DBSCAN behavioral modes (client-side)."
site_author: "Anni Eriksson"
site_url: "https://demo.executivefunctionos.com/"

repo_name: "erikssonaicloud-gif/percolation-import"
repo_url: "https://github.com/erikssonaicloud-gif/percolation-import"
edit_uri: "blob/main/docs/"

copyright: "Copyright &copy; 2025 Executive Function OS"

docs_dir: "docs"
site_dir: "site"

theme:
  name: "material"
  language: "en"
  palette:
    - scheme: "default"
      primary: "indigo"
      accent: "cyan"
      toggle:
        icon: "material/brightness-7"
        name: "Switch to dark mode"
    - scheme: "slate"
      primary: "indigo"
      accent: "cyan"
      toggle:
        icon: "material/brightness-4"
        name: "Switch to light mode"
  features:
    - "navigation.tabs"
    - "navigation.sections"
    - "navigation.top"
    - "navigation.tracking"
    - "search.suggest"
    - "search.highlight"
    - "content.tabs.link"
    - "content.code.annotation"
    - "content.code.copy"
    - "content.action.edit"
  icon:
    repo: "fontawesome/brands/github"
    logo: "material/run-fast"
    favicon: "material/run-fast"

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/erikssonaicloud-gif/percolation-import"
      name: "Source Code"
  generator: false
  analytics:
    provider: "google"
    property: "G-XXXXXXXXXX" # Placeholder, replace if you have GA

markdown_extensions:
  - "pymdownx.highlight":
      anchor_linenums: true
  - "pymdownx.inlinehilite"
  - "pymdownx.snippets"
  - "pymdownx.superfences"
  - "pymdownx.tabbed":
      alternate_style: true
  - "pymdownx.critic"
  - "pymdownx.caret"
  - "pymdownx.keys"
  - "pymdownx.mark"
  - "pymdownx.tilde"
  - "admonition"
  - "pymdownx.details"
  - "attr_list"
  - "md_in_html"
  - "footnotes"
  - "tables"
  - "def_list"
  - "abbr"
  - "pymdownx.arithmatex":
      generic: true
  - "pymdownx.tasklist":
      custom_checkbox: true

extra_javascript:
  - "javascripts/katex.js"
  - "https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.js"
  - "https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/contrib/auto-render.min.js"

extra_css:
  - "https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.css"

nav:
  - "Home": "index.md"
  - "Demo": "demo.md"
  - "Methodology": "methodology.md"
  - "Tools": "tools.md"
  - "Research": "research.md"
  - "Participate": "participate.md"
  - "About": "about.md"
