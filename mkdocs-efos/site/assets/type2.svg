<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="300" height="200" rx="16" fill="#0f172a" />
  <g opacity="0.1">
    <line x1="0" y1="50" x2="300" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="0" y1="100" x2="300" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="0" y1="150" x2="300" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="75" y1="0" x2="75" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="150" y1="0" x2="150" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="225" y1="0" x2="225" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
  </g>
  <!-- Branching Edges -->
  <path d="M 50,100 L 110,70 L 190,60 L 250,100 M 50,100 L 110,130 L 190,140 L 250,100 M 110,70 L 190,140 M 110,130 L 190,60" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#glow)" />
  <!-- Nodes -->
  <circle cx="50" cy="100" r="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="110" cy="70" r="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="110" cy="130" r="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="190" cy="60" r="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="190" cy="140" r="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="250" cy="100" r="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <!-- Text -->
  <text x="50" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Start</text>
  <text x="250" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Exit</text>
  <text x="150" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Type 2 — Complex Navigable</text>
</svg>
