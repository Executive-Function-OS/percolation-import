<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="#0f172a" />
  
  <!-- Connections -->
  <line x1="80" y1="80" x2="200" y2="125" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2" />
  <line x1="80" y1="170" x2="200" y2="125" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2" />
  <line x1="200" y1="125" x2="320" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2" />
  <line x1="200" y1="125" x2="320" y2="170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2" />

  <path d="M 80,80 L 80,170 M 320,80 L 320,170" stroke="#475569" stroke-width="2" fill="none" />

  <!-- Nodes -->
  <!-- Observer Layer -->
  <circle cx="80" cy="80" r="14" fill="url(#obsGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="80" cy="170" r="14" fill="url(#obsGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <text x="80" y="45" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">Observer</text>
  <text x="80" y="115" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">State Space</text>

  <!-- Executive Bridge -->
  <circle cx="200" cy="125" r="16" fill="url(#bridgeGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
  <text x="200" y="90" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Executive Bridge</text>
  <text x="200" y="165" font-family="Inter, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">(Vulnerable to Stress)</text>

  <!-- Operator Layer -->
  <circle cx="320" cy="80" r="14" fill="url(#opGrad)" stroke="#f472b6" stroke-width="2" filter="url(#glow)" />
  <circle cx="320" cy="170" r="14" fill="url(#opGrad)" stroke="#f472b6" stroke-width="2" filter="url(#glow)" />
  <text x="320" y="45" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#f472b6" text-anchor="middle">Operator</text>
  <text x="320" y="115" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Action Layer</text>

</svg>
