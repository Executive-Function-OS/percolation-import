<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="300" height="200" rx="16" fill="#0f172a" />
  <g opacity="0.1">
    <line x1="0" y1="50" x2="300" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="0" y1="100" x2="300" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="0" y1="150" x2="300" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="75" y1="0" x2="75" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="150" y1="0" x2="150" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
    <line x1="225" y1="0" x2="225" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
  </g>
  <!-- Path Edges -->
  <path d="M 50,100 L 110,100 L 190,100 L 250,100" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <!-- Nodes -->
  <circle cx="50" cy="100" r="12" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
  <circle cx="110" cy="100" r="12" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
  <circle cx="190" cy="100" r="12" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
  <circle cx="250" cy="100" r="12" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
  <!-- Text -->
  <text x="50" y="135" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">Start</text>
  <text x="250" y="135" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">Exit</text>
  <text x="150" y="40" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Type 1 — Solvable</text>
</svg>
